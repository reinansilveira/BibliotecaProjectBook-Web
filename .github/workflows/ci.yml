name: CI

on:
  push:
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Lint, unit tests and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Unit tests with coverage
        run: npm run test:ci

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage

      - name: Production build
        run: npm run build

      - name: Build Docker image
        run: docker build --tag library-web:${{ github.sha }} .

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout web
        uses: actions/checkout@v7

      - name: Checkout API
        uses: actions/checkout@v7
        with:
          repository: reinansilveira/BibliotecaProjectBook
          path: api

      - name: Start the API, SQL Server and RabbitMQ
        working-directory: api
        env:
          AUTH_RATE_LIMIT: 100000
        run: |
          docker compose up -d --build
          for attempt in $(seq 1 60); do
            curl -sf http://localhost:5080/health && exit 0
            sleep 5
          done
          docker compose logs api
          exit 1

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run end-to-end tests
        run: npm run e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
