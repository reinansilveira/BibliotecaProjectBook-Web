name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build:
    name: Build for GitHub Pages
    if: vars.API_BASE_URL != '' && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout the commit that passed CI
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Production build pointing to the deployed API
        run: >
          npx ng build --configuration production
          --base-href "/${{ github.event.repository.name }}/"
          --define "API_BASE_URL='${{ vars.API_BASE_URL }}'"

      - name: Serve index.html for client-side routes
        run: cp dist/library-web/browser/index.html dist/library-web/browser/404.html

      - name: Upload the site
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/library-web/browser

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
