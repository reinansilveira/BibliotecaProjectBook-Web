<section class="page narrow">
  <h1 class="page-title">Profile</h1>
  <p class="page-subtitle">Keep your contact details up to date.</p>

  @if (member(); as current) {
    <div class="surface card">
      <div class="summary">
        <span class="badge">{{ current.role }}</span>
        <span>Member since {{ current.createdAt | date: 'longDate' }}</span>
      </div>

      <form class="form-grid" [formGroup]="form" (ngSubmit)="save()">
        <mat-form-field appearance="outline">
          <mat-label>Full name</mat-label>
          <input matInput formControlName="name" />
          <mat-error>Name is required.</mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Email</mat-label>
          <input matInput type="email" formControlName="email" />
          <mat-error>Enter a valid email.</mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Phone</mat-label>
          <input matInput type="tel" formControlName="phone" />
          <mat-error>Phone is required.</mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Birth date</mat-label>
          <input matInput type="date" formControlName="birthDate" />
          <mat-error>Birth date is required.</mat-error>
        </mat-form-field>

        <div class="actions">
          <button mat-flat-button type="submit" [disabled]="saving()">Save changes</button>
        </div>
      </form>
    </div>
  } @else {
    <mat-progress-bar mode="indeterminate" aria-label="Loading profile" />
  }
</section>
